[package]
name = "phira-mp-common"
version = "0.1.0"
# 上游 workspace 用 edition 2024；这里降到 2021（本仓库统一），源码本身只用 2021 语法。
edition = "2021"

[dependencies]
anyhow = { workspace = true }
byteorder = "1.5.0"
chrono = { workspace = true }
half = "2.7.1"
tap = "1.0.1"
uuid = { workspace = true }

phira-mp-macros = { path = "../phira-mp-macros" }

# 只有原生版需要真正的 TCP 流；wasm 下由页面 WebSocket 隧道取代（见本文件 lib.rs 的 cfg 门控）。
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["net", "io-util", "sync", "rt", "time"] }
tracing = { workspace = true }
