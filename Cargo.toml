[workspace]
members = [
    "phira",
    "phira-main",
    "phira-monitor",
    "prpr",
    "prpr-auto-offset",
    "prpr-avc",
    "prpr-l10n",
    "prpr-pbc",
    "tools/*",
]
resolver = "2"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(closed)'] }

[workspace.package]
version = "0.8.2"
edition = "2021"
license = "GPL-3.0-only"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1.89"
base64 = "0.22.1"
bitflags = "2.11.0"
# `wasmbind` 让 chrono 在 wasm32 下用 JS Date 取当前时间：否则 `Utc::now()` /
# `Local::now()` 会走 std 的 SystemTime::now()，在 wasm32-unknown-unknown 上直接 panic。
chrono = { version = "0.4.44", features = ["wasmbind"] }
fluent = "0.17.0"
fluent-syntax = "0.12.0"
futures-util = "0.3.32"
hex = "0.4.3"
http = "1"
image = { version = "0.25.10", default-features = false }
inputbox = "0.1.5"
lru = "0.16.3"
lyon = "1.0.19"

macroquad = { git = "https://github.com/Mivik/prpr-macroquad", rev = "2150130", default-features = false }
miniquad = { git = "https://github.com/Mivik/prpr-miniquad", rev = "138679c" }
nalgebra = "0.34.1"

objc2 = "0.6.4"
objc2-core-foundation = "0.3.2"
objc2-foundation = "0.3.2"
objc2-ui-kit = "0.3.2"
objc2-uniform-type-identifiers = "0.3.2"
once_cell = "1.21.4"
phira = { path = "phira", default-features = false }
phira-mp-client = { git = "https://github.com/TeamFlos/phira-mp", rev = "cc822df" }
# 协议层改为本仓库内的 vendor 版本：同一份上游代码，但 Stream（TCP 长连接）
# 被 cfg 门控成「仅非 wasm」，这样浏览器端也能复用协议定义（bin/command）。
phira-mp-common = { path = "vendor/phira-mp-common" }
pollster = "0.4.0"
prpr = { path = "prpr", default-features = false }
prpr-auto-offset = { path = "prpr-auto-offset" }
prpr-avc = { path = "prpr-avc" }
prpr-l10n = { path = "prpr-l10n" }
rand = "0.8.5"
regex = "1.12.3"
reqwest = { version = "0.13.2", default-features = false }
rfd = "0.17.2"
sasa = { git = "https://github.com/Mivik/sasa", rev = "e76229b", default-features = false }
serde = "1.0.228"
serde_json = "1.0.149"
serde_yaml = "0.9.34"
sha2 = "0.10.9"
sys-locale = "0.3.2"
tempfile = "3.27.0"
tokio = "1.50.0"
tracing = "0.1.44"
uuid = { version = "1.22.0", features = ["rng-getrandom"] }
url = "2"
walkdir = "2.5.0"
zip = { version = "8.3.0", default-features = false }

[profile.release]
opt-level = 2
strip = true

# Use the vendored sasa so the browser (wasm32) target can use a WebAudio
# backend. The vendored copy is the same commit as the git dependency above
# and ships inside this repository (vendor/sasa), so a fresh clone builds as-is.
[patch."https://github.com/Mivik/sasa"]
sasa = { path = "vendor/sasa" }

# phira-mp-client（git 依赖）内部依赖的是它自己仓库里的 phira-mp-common；
# 这里把它一并重定向到本仓库的 vendor 版本，保证 client 与 phira 用的是
# 同一个 crate 实例（否则会因为两份 common 的类型不同而编译失败）。
[patch."https://github.com/TeamFlos/phira-mp"]
phira-mp-common = { path = "vendor/phira-mp-common" }

# The stock getrandom refuses to build for wasm32-unknown-unknown without the
# `js` feature (which pulls in wasm-bindgen and conflicts with miniquad's JS
# loader). The vendored copies use a small `host_random` import instead and are
# committed under vendor/ in this repository.
[patch.crates-io]
getrandom-02 = { package = "getrandom", path = "vendor/getrandom-0.2.17" }
getrandom-04 = { package = "getrandom", path = "vendor/getrandom-0.4.2" }

[profile.dev.package."*"]
opt-level = 2
